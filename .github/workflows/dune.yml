name: Dune alert

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dune-alert
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check BookMyShow
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python dune_cloud.py

      - name: Save state
        run: |
          if [ -n "$(git status --porcelain state.json)" ]; then
            git config user.name "dune-bot"
            git config user.email "dune-bot@users.noreply.github.com"
            git add state.json
            git commit -m "update state"
            git push
          fi
